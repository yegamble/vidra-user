name: contract-ci

# Frontend <-> backend contract guard. Two checks against vidra-core's OpenAPI spec
# (fetched from the public repo, so no token is needed):
#   1. path check   — every /api/ path the client (lib/api/*.ts) calls exists in the
#      spec (structural, name-agnostic, not flaky).
#   2. type freshness — regenerates lib/api/generated.ts from the spec and fails if
#      the committed file is stale. Since lib/api/types.ts DERIVES every type from
#      generated.ts, this makes SHAPE drift (not just path drift) impossible to miss.
#
# It cannot see backend-side spec edits on its own, so vidra-core's `openapi`
# workflow is the backend half of the same contract.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fetch backend OpenAPI contract from vidra-core (public)
        run: |
          mkdir -p .contract
          curl -fsSL https://raw.githubusercontent.com/yegamble/vidra-core/main/api/openapi.yaml \
            -o .contract/openapi.yaml

      - name: Check frontend<->backend path contract
        env:
          OPENAPI_PATH: .contract/openapi.yaml
        run: node scripts/check-contract.mjs

      - name: Verify generated API types are up to date with the spec
        env:
          OPENAPI_PATH: .contract/openapi.yaml
        run: |
          npm run codegen
          if ! git diff --quiet -- lib/api/generated.ts; then
            echo "::error::lib/api/generated.ts is stale vs vidra-core's openapi.yaml. Run 'npm run codegen' and commit the result."
            git --no-pager diff -- lib/api/generated.ts | head -80
            exit 1
          fi
          echo "OK: generated API types match the backend contract."
