name: contract-ci

# Frontend <-> backend contract drift guard. Fails when the vidra-user API client
# (lib/api/*.ts) references an /api/ path that no longer exists in vidra-core's
# OpenAPI spec (path params compared structurally, so it is name-agnostic and not
# flaky). It does NOT yet check methods/field shapes — that needs generated types.
#
# Since the split, vidra-core is a separate PUBLIC repo, so this fetches the spec's
# raw file from it (no token needed) and points the checker at it via OPENAPI_PATH.
# It cannot see backend-side spec changes on its own, so also run vidra-core's
# `openapi` workflow as the backend half of the same contract.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch backend OpenAPI contract from vidra-core (public)
        run: |
          mkdir -p .contract
          curl -fsSL https://raw.githubusercontent.com/yegamble/vidra-core/main/api/openapi.yaml \
            -o .contract/openapi.yaml

      - name: Check frontend<->backend path contract
        env:
          OPENAPI_PATH: .contract/openapi.yaml
        run: node scripts/check-contract.mjs
