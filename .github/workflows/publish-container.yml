name: publish-container

on:
  release:
    types: [published]
  # Re-publish the image for a tag that is ALREADY released — a build that died
  # on a transient registry error, or a tag released while NEXT_PUBLIC_API_BASE_URL
  # was still unset (this repo's most likely reason). It builds the tag, never
  # the default branch (see "Resolve the tag being published"), and the origin
  # gate below is unconditional, so a dispatch is held to exactly the same
  # standard as a release.
  workflow_dispatch:
    inputs:
      tag:
        description: existing vX.Y.Z tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # One source of truth for "which tag is this build?", so the two triggers
      # cannot drift: `inputs.tag` is empty on a release event and
      # `github.event.release.tag_name` is empty on a dispatch. The existence
      # check runs BEFORE the checkout so a typo'd dispatch input fails with a
      # sentence instead of a checkout error — and so this workflow only ever
      # builds a tag, never the default branch.
      - name: Resolve the tag being published
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          TAG="${RELEASE_TAG:-$INPUT_TAG}"
          if [ -z "${TAG}" ]; then
            echo "::error::No tag to publish: neither the release payload nor the 'tag' input carried one."
            exit 1
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag '${TAG}' does not exist in ${GITHUB_REPOSITORY}. Push the tag (or cut the release) first — this workflow never builds the default branch."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Check out the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false

      # Fail before we spend 20 minutes building an image nobody can use. This
      # step is deliberately unconditional: a workflow_dispatch re-publish gets
      # the same gate as a release, because the resulting image is exactly as
      # public and exactly as broken without a real origin.
      # NEXT_PUBLIC_* is inlined into the CLIENT bundle by `next build`, so this
      # origin is frozen into every browser that loads the released image and a
      # restart cannot repoint it (lib/config.ts:10-12, Dockerfile:23-24). An
      # unset variable used to silently fall back to http://localhost:8080, which
      # ships a production image whose every client-side call goes to the
      # visitor's own machine — total, silent breakage. An empty value is just as
      # bad (lib/config.ts uses `??`, so "" survives and every call becomes
      # same-origin), so blank and localhost are both rejected here rather than
      # relying on the build to notice.
      - name: Require a real public API origin
        env:
          API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          set -eu
          if [ -z "${API_BASE_URL}" ]; then
            echo "::error::Repository variable NEXT_PUBLIC_API_BASE_URL is not set. Set it to the public vidra-core origin (e.g. https://api.example.com) under Settings > Secrets and variables > Actions > Variables, then re-run this release."
            exit 1
          fi
          case "${API_BASE_URL}" in
            http://*|https://*) ;;
            *)
              echo "::error::NEXT_PUBLIC_API_BASE_URL must be an absolute origin including the scheme; got '${API_BASE_URL}'."
              exit 1
              ;;
          esac
          case "${API_BASE_URL}" in
            *localhost*|*127.0.0.1*|*0.0.0.0*)
              echo "::error::NEXT_PUBLIC_API_BASE_URL points at '${API_BASE_URL}'. A released image baked with a loopback origin makes every browser call the visitor's own machine."
              exit 1
              ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive immutable image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=sha,format=long

      - name: Build and push the released image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_* is compiled into the browser bundle, so this is a
          # release-defining input, not a convenience default. Deliberately NO
          # `||` fallback: the "Require a real public API origin" step above has
          # already proved the repository variable is set to an absolute,
          # non-loopback origin, and anything else must fail the release rather
          # than publish a broken image.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
