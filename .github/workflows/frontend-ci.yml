name: frontend-ci

# Standalone vidra-user repo: the project lives at the repo root, so this builds
# and tests directly (no working-directory / path filters / scaffold detection —
# those were only needed while user was a subdirectory of the vidra monorepo).
#
# Local/CI parity: run the SAME canonical gate developers run locally —
# `npm run ci` (typecheck + lint + unit + build + Playwright smoke). Do not add
# checks here that aren't in the `ci` script, or the two drift (ci-guard.yml
# enforces this).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run canonical gate (npm run ci)
        run: npm run ci

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
