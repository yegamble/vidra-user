name: frontend-ci

# Standalone vidra-user repo: the project lives at the repo root, so this builds
# and tests directly (no working-directory / path filters / scaffold detection —
# those were only needed while user was a subdirectory of the vidra monorepo).
#
# Local/CI parity: run the SAME canonical gate developers run locally —
# `npm run ci` (typecheck + lint + unit + build + Playwright smoke). Do not add
# checks here that aren't in the `ci` script, or the two drift (ci-guard.yml
# enforces this).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run canonical gate (npm run ci)
        run: npm run ci

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
